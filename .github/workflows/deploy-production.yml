name: MetroScope Production Deployment

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Continuous Integration & Verification Gate
  # ----------------------------------------------------------------------------
  verify:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend ESLint
        working-directory: frontend
        run: npm run lint

      - name: Frontend TypeScript Type Check
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend Production Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend Test Suite
        working-directory: backend
        run: pytest -v
        env:
          ENVIRONMENT: test
          DEBUG: "true"
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          DATABASE_SYNC_URL: sqlite:///:memory:
          EMAIL_DRY_RUN: "true"
          SOCIAL_DRY_RUN: "true"

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
        env:
          POSTGRES_PASSWORD: dummy_validation_password_12345

  # ----------------------------------------------------------------------------
  # Stage 2: Build & Publish Immutable Production Images to GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Publish Container Images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        run: |
          echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/backend:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/backend:${{ steps.meta.outputs.SHORT_SHA }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Worker Image
      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/worker:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/worker:${{ steps.meta.outputs.SHORT_SHA }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infrastructure/docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/frontend:${{ steps.meta.outputs.SHORT_SHA }}
            ghcr.io/${{ steps.meta.outputs.REPO_LOWER }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 3: Automated Secure SSH Deployment to AWS EC2 t3.small
  # ----------------------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy to AWS EC2 (Mumbai ap-south-1)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 Instance via Secure SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd /opt/metroscope
            
            # Export target immutable image tag
            export IMAGE_TAG="${{ github.sha }}"
            export GHCR_REGISTRY="ghcr.io"
            export GHCR_OWNER="$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')"
            export GHCR_USER="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}"
            
            # Pull repository updates if git checkout exists on server
            if [ -d ".git" ]; then
                git fetch --all --prune
                git checkout ${{ github.sha }}
            fi
            
            # Execute automated zero-downtime deployment script
            chmod +x scripts/*.sh
            ./scripts/deploy.sh
            
            # Run diagnostic deployment validation
            ./scripts/validate_deployment.sh
