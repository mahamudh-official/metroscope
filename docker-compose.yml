services:
  db:
    image: postgres:16-alpine
    container_name: metroscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metroscope}
      POSTGRES_USER: ${POSTGRES_USER:-metroscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscope_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metroscope_user} -d ${POSTGRES_DB:-metroscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metroscope_net

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: metroscope-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metroscope}
      POSTGRES_USER: ${POSTGRES_USER:-metroscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscope_secure_password}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metroscope_user}:${POSTGRES_PASSWORD:-metroscope_secure_password}@db:5432/${POSTGRES_DB:-metroscope}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-metroscope_user}:${POSTGRES_PASSWORD:-metroscope_secure_password}@db:5432/${POSTGRES_DB:-metroscope}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["localhost","127.0.0.1","metroscope.news","www.metroscope.news","backend"]}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-true}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-newsletter@metroscope.news}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MetroScope News}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15.0}
      SUBSCRIPTION_RATE_LIMIT_PER_HOUR: ${SUBSCRIPTION_RATE_LIMIT_PER_HOUR:-5}
      VERIFICATION_TOKEN_EXPIRE_HOURS: ${VERIFICATION_TOKEN_EXPIRE_HOURS:-24}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metroscope_net

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/worker.Dockerfile
    container_name: metroscope-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metroscope}
      POSTGRES_USER: ${POSTGRES_USER:-metroscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscope_secure_password}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metroscope_user}:${POSTGRES_PASSWORD:-metroscope_secure_password}@db:5432/${POSTGRES_DB:-metroscope}
      WEBZ_IO_API_KEY: ${WEBZ_IO_API_KEY:-}
      WEBZ_IO_BASE_URL: ${WEBZ_IO_BASE_URL:-https://api.webz.io}
      WEBZ_IO_ENDPOINT: ${WEBZ_IO_ENDPOINT:-/newsApiLite}
      WEBZ_IO_COLLECTION_ENABLED: ${WEBZ_IO_COLLECTION_ENABLED:-true}
      WEBZ_IO_TIMEZONE: ${WEBZ_IO_TIMEZONE:-Asia/Dhaka}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      SITE_URL: ${SITE_URL:-https://metroscope.news}
      SOCIAL_PUBLISHING_ENABLED: ${SOCIAL_PUBLISHING_ENABLED:-false}
      SOCIAL_DRY_RUN: ${SOCIAL_DRY_RUN:-true}
      SOCIAL_PUBLISHING_INTERVAL_MINUTES: ${SOCIAL_PUBLISHING_INTERVAL_MINUTES:-30}
      SOCIAL_MAX_POSTS_PER_RUN: ${SOCIAL_MAX_POSTS_PER_RUN:-2}
      SOCIAL_MIN_QUALITY_SCORE: ${SOCIAL_MIN_QUALITY_SCORE:-70.0}
      STALE_PUBLISHING_TIMEOUT_MINUTES: ${STALE_PUBLISHING_TIMEOUT_MINUTES:-60}
      FACEBOOK_ENABLED: ${FACEBOOK_ENABLED:-false}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION:-v21.0}
      FACEBOOK_MAX_POSTS_PER_DAY: ${FACEBOOK_MAX_POSTS_PER_DAY:-48}
      X_ENABLED: ${X_ENABLED:-false}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      X_ACCESS_TOKEN: ${X_ACCESS_TOKEN:-}
      X_ACCESS_TOKEN_SECRET: ${X_ACCESS_TOKEN_SECRET:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_MAX_POSTS_PER_DAY: ${X_MAX_POSTS_PER_DAY:-15}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-true}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-newsletter@metroscope.news}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MetroScope News}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15.0}
      NEWSLETTER_SCHEDULE_HOUR: ${NEWSLETTER_SCHEDULE_HOUR:-6}
      NEWSLETTER_SCHEDULE_MINUTE: ${NEWSLETTER_SCHEDULE_MINUTE:-0}
      NEWSLETTER_MIN_QUALITY_SCORE: ${NEWSLETTER_MIN_QUALITY_SCORE:-70.0}
      NEWSLETTER_MAX_ARTICLES: ${NEWSLETTER_MAX_ARTICLES:-5}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metroscope_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: metroscope-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: MetroScope
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
      INTERNAL_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metroscope_net

  nginx:
    image: nginx:1.27-alpine
    container_name: metroscope-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - metroscope_net

volumes:
  postgres_data:
    driver: local

networks:
  metroscope_net:
    driver: bridge
