services:
  db:
    image: postgres:16-alpine
    container_name: metroscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metroscope}
      POSTGRES_USER: ${POSTGRES_USER:-metroscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscope_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metroscope_user} -d ${POSTGRES_DB:-metroscope}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - metroscope_net

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: metroscope-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metroscope}
      POSTGRES_USER: ${POSTGRES_USER:-metroscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscope_secure_password}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metroscope_user}:${POSTGRES_PASSWORD:-metroscope_secure_password}@db:5432/${POSTGRES_DB:-metroscope}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-metroscope_user}:${POSTGRES_PASSWORD:-metroscope_secure_password}@db:5432/${POSTGRES_DB:-metroscope}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - metroscope_net

  worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/worker.Dockerfile
    container_name: metroscope-worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-metroscope}
      POSTGRES_USER: ${POSTGRES_USER:-metroscope_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metroscope_secure_password}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-metroscope_user}:${POSTGRES_PASSWORD:-metroscope_secure_password}@db:5432/${POSTGRES_DB:-metroscope}
      GDELT_BASE_URL: ${GDELT_BASE_URL:-https://api.gdeltproject.org/api/v2/doc/doc}
      GDELT_REQUEST_TIMEOUT_SECONDS: ${GDELT_REQUEST_TIMEOUT_SECONDS:-15}
      GDELT_POLL_INTERVAL_MINUTES: ${GDELT_POLL_INTERVAL_MINUTES:-15}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - metroscope_net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: metroscope-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_NAME: MetroScope
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - metroscope_net

  nginx:
    image: nginx:1.27-alpine
    container_name: metroscope-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/certbot/conf:/etc/letsencrypt:ro
      - ./infrastructure/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - metroscope_net

volumes:
  postgres_data:
    driver: local

networks:
  metroscope_net:
    driver: bridge
